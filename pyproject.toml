[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vswarehouse"
version = "0.2.0"
description = "Python client for the vs-warehouse statistical data API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Virtus Solutions", email = "api@virtus-solutions.io" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]
keywords = ["statistics", "economics", "api", "new-zealand", "australia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://api.virtus-solutions.io"
Documentation = "https://api.virtus-solutions.io/docs"
Repository = "https://github.com/virtus-solutions/vswarehouse-python"

[project.optional-dependencies]
dev = ["pytest", "responses", "pandas"]
polars = ["polars>=0.20"]
plot = ["matplotlib>=3.5"]

[tool.hatch.build.targets.wheel]
packages = ["vswarehouse"]
